<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05140d" />
      <stop offset="50%" stop-color="#0a2318" />
      <stop offset="100%" stop-color="#020905" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.15)" />
      <stop offset="100%" stop-color="rgba(5, 40, 25, 0.4)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Grid Lines -->
  <g stroke="rgba(16, 185, 129, 0.1)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Cosmic Nebula Circles -->
  <circle cx="200" cy="150" r="140" fill="#059669" opacity="0.15" filter="url(#glow)" />
  <circle cx="650" cy="300" r="160" fill="#10b981" opacity="0.12" filter="url(#glow)" />

  <!-- Main Agri Dashboard Card Mockup -->
  <g transform="translate(60, 40)">
    <!-- Top Header Bar -->
    <rect width="680" height="370" rx="16" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Top Bar inside Card -->
    <rect width="680" height="50" rx="16" fill="rgba(6, 78, 59, 0.5)" />
    <circle cx="25" cy="25" r="6" fill="#ef4444" opacity="0.8" />
    <circle cx="45" cy="25" r="6" fill="#eab308" opacity="0.8" />
    <circle cx="65" cy="25" r="6" fill="#10b981" opacity="0.8" />
    
    <!-- Logo & Title -->
    <path d="M 105 20 C 115 10, 125 15, 120 30 C 110 30, 105 25, 105 20 Z" fill="#34d399" />
    <path d="M 120 30 C 125 18, 135 15, 132 28 Z" fill="#10b981" />
    <text x="140" y="32" fill="#ecfdf5" font-family="system-ui, sans-serif" font-weight="700" font-size="16" letter-spacing="1">AGRIPOOL PLATFORM</text>
    <rect x="520" y="15" width="135" height="22" rx="11" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1" />
    <text x="540" y="30" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="600">● LIVE WORKFLOW</text>

    <!-- Left Stats Panel: Produce Pooling -->
    <rect x="25" y="70" width="300" height="135" rx="12" fill="rgba(2, 44, 34, 0.7)" stroke="rgba(16, 185, 129, 0.3)" />
    <text x="45" y="98" fill="#a7f3d0" font-family="system-ui, sans-serif" font-weight="600" font-size="14">Produce Lot Aggregation</text>
    <text x="45" y="135" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="28">1,480 MT</text>
    <text x="180" y="132" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">↑ +18.4% pooled</text>
    <text x="45" y="165" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12">14 active farmer clusters • Guntur &amp; Krishna</text>
    <rect x="45" y="180" width="260" height="6" rx="3" fill="rgba(16, 185, 129, 0.2)" />
    <rect x="45" y="180" width="200" height="6" rx="3" fill="#10b981" />

    <!-- Right Stats Panel: Settlement & Escrow -->
    <rect x="355" y="70" width="300" height="135" rx="12" fill="rgba(2, 44, 34, 0.7)" stroke="rgba(16, 185, 129, 0.3)" />
    <text x="375" y="98" fill="#a7f3d0" font-family="system-ui, sans-serif" font-weight="600" font-size="14">Digital Settlement Status</text>
    <text x="375" y="135" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="26">₹ 42.6 Lakhs</text>
    <text x="375" y="165" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">✓ Instant T+0 Escrow Clearing</text>
    <rect x="375" y="178" width="90" height="18" rx="9" fill="#047857" />
    <text x="388" y="191" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="10" font-weight="700">COMPLETED</text>

    <!-- Bottom Workflow Nodes -->
    <rect x="25" y="225" width="630" height="120" rx="12" fill="rgba(2, 44, 34, 0.6)" stroke="rgba(16, 185, 129, 0.25)" />
    <text x="45" y="252" fill="#a7f3d0" font-family="system-ui, sans-serif" font-weight="600" font-size="13">Digital Lot Management &amp; Logistics Tracking</text>
    
    <!-- Node 1 -->
    <circle cx="85" cy="295" r="18" fill="#059669" stroke="#34d399" stroke-width="2" />
    <text x="80" y="300" fill="#fff" font-family="sans-serif" font-size="14" font-weight="bold">1</text>
    <text x="60" y="328" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">Lot Ingestion</text>

    <!-- Connector -->
    <line x1="105" y1="295" x2="225" y2="295" stroke="#34d399" stroke-width="2" stroke-dasharray="4 4" />

    <!-- Node 2 -->
    <circle cx="245" cy="295" r="18" fill="#059669" stroke="#34d399" stroke-width="2" />
    <text x="240" y="300" fill="#fff" font-family="sans-serif" font-size="14" font-weight="bold">2</text>
    <text x="215" y="328" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">Produce Grading</text>

    <!-- Connector -->
    <line x1="265" y1="295" x2="385" y2="295" stroke="#34d399" stroke-width="2" stroke-dasharray="4 4" />

    <!-- Node 3 -->
    <circle cx="405" cy="295" r="18" fill="#059669" stroke="#34d399" stroke-width="2" />
    <text x="400" y="300" fill="#fff" font-family="sans-serif" font-size="14" font-weight="bold">3</text>
    <text x="375" y="328" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">Buyer Aggregation</text>

    <!-- Connector -->
    <line x1="425" y1="295" x2="545" y2="295" stroke="#34d399" stroke-width="2" />

    <!-- Node 4 -->
    <circle cx="565" cy="295" r="18" fill="#10b981" stroke="#a7f3d0" stroke-width="2" />
    <text x="560" y="300" fill="#fff" font-family="sans-serif" font-size="14" font-weight="bold">✓</text>
    <text x="535" y="328" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700">Settlement</text>
  </g>
</svg>
