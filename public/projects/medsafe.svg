<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="medBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041226" />
      <stop offset="50%" stop-color="#0b2347" />
      <stop offset="100%" stop-color="#020817" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="medCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0.15)" />
      <stop offset="100%" stop-color="rgba(11, 35, 71, 0.5)" />
    </linearGradient>
    <filter id="medGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#medBgGrad)" />

  <!-- Grid Lines -->
  <g stroke="rgba(6, 182, 212, 0.08)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Cosmic Blue Nebulas -->
  <circle cx="220" cy="140" r="150" fill="#0284c7" opacity="0.15" filter="url(#medGlow)" />
  <circle cx="680" cy="320" r="170" fill="#3b82f6" opacity="0.12" filter="url(#medGlow)" />

  <!-- Main MedSafe Card Mockup -->
  <g transform="translate(60, 40)">
    <rect width="680" height="370" rx="16" fill="url(#medCardBg)" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Top Header Bar -->
    <rect width="680" height="50" rx="16" fill="rgba(14, 116, 144, 0.4)" />
    <circle cx="25" cy="25" r="6" fill="#ef4444" opacity="0.8" />
    <circle cx="45" cy="25" r="6" fill="#eab308" opacity="0.8" />
    <circle cx="65" cy="25" r="6" fill="#10b981" opacity="0.8" />
    
    <!-- Medical Cross Icon & Brand -->
    <rect x="100" y="18" width="16" height="16" rx="3" fill="#06b6d4" />
    <path d="M 105 26 L 111 26 M 108 23 L 108 29" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <text x="125" y="32" fill="#f0f9ff" font-family="system-ui, sans-serif" font-weight="700" font-size="16" letter-spacing="1">MEDSAFE HEALTHCARE</text>
    <rect x="525" y="15" width="130" height="22" rx="11" fill="rgba(6, 182, 212, 0.25)" stroke="#06b6d4" stroke-width="1" />
    <text x="542" y="30" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">● AI MONITORING</text>

    <!-- Card 1: Medication Adherence -->
    <rect x="25" y="70" width="310" height="140" rx="12" fill="rgba(8, 47, 73, 0.7)" stroke="rgba(6, 182, 212, 0.3)" />
    <text x="45" y="96" fill="#7dd3fc" font-family="system-ui, sans-serif" font-weight="600" font-size="13">Patient Adherence Rate</text>
    <text x="45" y="132" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="28">96.8%</text>
    <text x="165" y="130" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">On Schedule</text>
    
    <rect x="45" y="148" width="270" height="48" rx="8" fill="rgba(3, 105, 161, 0.3)" />
    <circle cx="65" cy="172" r="8" fill="#10b981" />
    <path d="M 62 172 L 64 175 L 68 170" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="82" y="167" fill="#f0fdf4" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Metformin 500mg (8:00 AM)</text>
    <text x="82" y="183" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Verified by Patient • Adherence logged</text>

    <!-- Card 2: Drug Interaction Engine -->
    <rect x="350" y="70" width="305" height="140" rx="12" fill="rgba(8, 47, 73, 0.7)" stroke="rgba(6, 182, 212, 0.3)" />
    <text x="370" y="96" fill="#7dd3fc" font-family="system-ui, sans-serif" font-weight="600" font-size="13">AI Drug Interaction Checker</text>
    
    <rect x="370" y="112" width="265" height="34" rx="8" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1" />
    <text x="385" y="133" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">✓ SAFE: No High-Risk Interactions</text>

    <text x="370" y="168" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="11">Active Prescriptions checked: 4 meds</text>
    <text x="370" y="188" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">RxNav &amp; Clinical Knowledgebase API</text>

    <!-- Card 3: Caregiver Escalation Alert System -->
    <rect x="25" y="230" width="630" height="115" rx="12" fill="rgba(8, 47, 73, 0.6)" stroke="rgba(6, 182, 212, 0.25)" />
    <text x="45" y="256" fill="#7dd3fc" font-family="system-ui, sans-serif" font-weight="600" font-size="13">Automated Caregiver Escalation Protocol</text>
    
    <g transform="translate(45, 275)">
      <rect x="0" y="0" width="180" height="50" rx="8" fill="rgba(14, 116, 144, 0.3)" />
      <text x="15" y="20" fill="#e0f2fe" font-family="sans-serif" font-size="11" font-weight="bold">Step 1: Patient Prompt</text>
      <text x="15" y="38" fill="#38bdf8" font-family="sans-serif" font-size="10">Push Notification Sent</text>
      
      <line x1="185" y1="25" x2="205" y2="25" stroke="#38bdf8" stroke-width="2" />
      
      <rect x="210" y="0" width="180" height="50" rx="8" fill="rgba(14, 116, 144, 0.3)" />
      <text x="225" y="20" fill="#e0f2fe" font-family="sans-serif" font-size="11" font-weight="bold">Step 2: Grace Period</text>
      <text x="225" y="38" fill="#fbbf24" font-family="sans-serif" font-size="10">30 Min Window Active</text>
      
      <line x1="395" y1="25" x2="415" y2="25" stroke="#38bdf8" stroke-width="2" />

      <rect x="420" y="0" width="185" height="50" rx="8" fill="rgba(14, 116, 144, 0.4)" stroke="#06b6d4" stroke-width="1" />
      <text x="435" y="20" fill="#f0f9ff" font-family="sans-serif" font-size="11" font-weight="bold">Step 3: Caregiver Alert</text>
      <text x="435" y="38" fill="#34d399" font-family="sans-serif" font-size="10">SMS &amp; Emergency Escalation</text>
    </g>
  </g>
</svg>
